name: embeddings-for-preferences
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  - pytorch>=2.0
  - pytorch-cuda=12.1
  - numpy>=1.24
  - scipy>=1.11
  - pandas>=2.0
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - pyyaml>=6.0
  - tqdm>=4.66
  - requests>=2.31
  - pip:
      - sentence-transformers>=3.0
      - transformers>=4.40
      - peft>=0.10
      - safetensors>=0.4
      - datasets>=2.16
      - pydantic>=2.0
      - openai>=1.12
      - anthropic>=0.25
      - python-dotenv>=1.0
      - pyreadstat>=1.2
