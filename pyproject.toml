[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-elicitation"
version = "0.1.0"
description = "Info-theoretic preference elicitation with persona bank from Pew ATP surveys"
readme = "readme.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.3.0",
    "pydantic>=2.0.0",
    "pyreadstat>=1.2.0",
    "pyyaml>=6.0",
    "openai>=1.0.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.0.0",
    "torch>=2.0.0",
    "tqdm>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
